
name: CloudOps 360 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python tests
        run: python -m pytest -v

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
   

  bash-check:
    name: Bash validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: bash -n scripts/health_check.sh

      - name: Check script permissions
        run: test -x scripts/health_check.sh

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [python-tests, bash-check]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t cloudops360-flask:${{ github.sha }} .

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan Git history for secrets
        run: gitleaks git --redact --exit-code 1 .

  integration-test:
    name: Docker Compose integration test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PASSWORD: ci_test_password_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Flask and PostgreSQL
        run: docker compose -p cloudops360ci up -d --build --wait --wait-timeout 120

      - name: Verify Flask health and database
        run: |
          python3 - <<'CHECK'
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:5000/health"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      data = json.load(response)
                      assert response.status == 200
                      assert data["status"] == "healthy"
                      assert data["database"] == "connected"
                  print("PASS: Flask and PostgreSQL are healthy")
                  break
              except Exception as exc:
                  if attempt == 29:
                      raise
                  print("Waiting for application:", exc)
                  time.sleep(2)
          CHECK

      - name: Verify ticket API
        run: |
          python3 - <<'CHECK'
          import json
          import urllib.request

          url = "http://127.0.0.1:5000/api/tickets"
          with urllib.request.urlopen(url, timeout=10) as response:
              data = json.load(response)
              assert response.status == 200
              assert isinstance(data, list)
          print("PASS: Ticket API returned a JSON list")
          CHECK

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p cloudops360ci logs --tail=100 --no-color

      - name: Clean up test containers
        if: always()
        run: docker compose -p cloudops360ci down --remove-orphans
